name: OpenRF Linux Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python source and run tests
        run: |
          python -m compileall -q openrf
          python -m unittest discover -s tests -v
      - name: Check optional Valhalla setup script syntax
        run: bash -n tools/setup-valhalla-wsl.sh
      - name: Check JavaScript and mapping regressions
        run: |
          node --check openrf/static/app.js
          node --check openrf/static/field-breadcrumbs.js
          node --check openrf/static/offline-trails.js
          node --check openrf/static/history-analysis.js
          node --check openrf/static/navigation.js
          node --check openrf/static/route_guidance.js
          node --check openrf/static/survey_map.js
          # Run all in-repository JavaScript suites, including new navigation DEMO tests.
          for test_file in tests/*.js; do node "$test_file"; done
