name: OpenRF Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The SDK no longer distributes the old 'tools' package.
          # v4 defaults to platform-tools; keep it explicit to prevent regressions.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false' 
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify source is present
        run: test -f gradlew && test -f settings.gradle.kts && test -d app
      - name: Run unit tests and build debug APK
        run: |
          gradle --version
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRF-v0.1.5-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
