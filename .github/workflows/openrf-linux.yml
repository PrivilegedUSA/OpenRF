name: OpenRF Linux Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python source and run tests
        run: |
          python -m compileall -q openrf
          python -m unittest discover -s tests -v
      - name: Check JavaScript and mapping regressions
        run: |
          node --check openrf/static/app.js
          node --check openrf/static/history-analysis.js
          node tests/test_frontend.js
          node tests/test_history_analysis.js
          node tests/test_signal_explorer.js
          node tests/test_reports_frontend.js
          node tests/test_readiness_frontend.js
          node tests/test_manual_location_frontend.js
